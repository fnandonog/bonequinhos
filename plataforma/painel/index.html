<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agência do Zé</title>
<style>
  :root { --bg:#f6f3ee; --card:#fff; --tx:#1d1b18; --mut:#6f6a62; --lin:#e6e0d6; --pri:#ff7a1a; --ok:#1f9d55; --err:#d64545; --warn:#c98a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151412; --card:#1f1d1a; --tx:#f1ede6; --mut:#a59f95; --lin:#34302a; } }
  * { box-sizing:border-box; }
  a { color:var(--pri); }
  body { margin:0; font:15px/1.45 -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--tx); }
  body { display:flex; min-height:100vh; }
  .lado { position:sticky; top:0; height:100vh; width:236px; flex:none; background:#16130f; color:#e9e2d8; display:flex; flex-direction:column; padding:16px 12px; gap:4px; }
  .marca { display:flex; align-items:center; gap:10px; padding:4px 8px 18px; }
  .marca img { width:38px; height:38px; border-radius:11px; object-fit:cover; background:var(--pri); }
  .marca b { font-size:16px; } .marca small { display:block; color:#a59f95; font-size:12px; font-weight:400; }
  .lado nav { display:flex; flex-direction:column; gap:2px; }
  .item { display:flex; align-items:center; gap:11px; width:100%; background:none; border:0; color:#cfc7bb; font:inherit; font-size:14px; padding:9px 10px; border-radius:10px; cursor:pointer; text-decoration:none; text-align:left; }
  .item svg { width:19px; height:19px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .item:hover { background:#ffffff0f; color:#fff; }
  .item.on { background:#ff7a1a22; color:#ffb27a; font-weight:600; }
  .item .num { margin-left:auto; background:var(--pri); color:#fff; font-size:11px; font-weight:700; padding:1px 7px; border-radius:99px; }
  .lado .rodape { margin-top:auto; display:flex; flex-direction:column; gap:2px; padding-top:12px; border-top:1px solid #ffffff14; }
  .lado .b.pri { margin-top:8px; width:100%; }
  #status { color:#ffb27a; font-size:12px; padding:4px 10px; min-height:18px; }
  .conteudo { flex:1; min-width:0; }
  .topo { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--lin); padding:14px 24px; }
  .topo h1 { font-size:19px; margin:0; }
  main { max-width:1180px; margin:0 auto; padding:20px 24px; }
  @media (max-width: 760px) {
    body { flex-direction:column; }
    .lado { position:sticky; z-index:3; height:auto; width:100%; flex-direction:row; align-items:center; padding:8px 10px; overflow-x:auto; gap:6px; }
    .marca { padding:0 6px 0 0; } .marca div { display:none; }
    .lado nav, .lado .rodape { flex-direction:row; margin:0; padding:0; border:0; }
    .item { width:auto; white-space:nowrap; padding:8px 10px; } .item span.rot { display:none; } .item.on span.rot { display:inline; }
    .lado .b.pri { margin:0; width:auto; white-space:nowrap; } #status { display:none; }
    .topo { padding:12px 16px; } main { padding:16px; }
  }
  .grade { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--lin); border-radius:14px; padding:14px; }
  .linha { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .mut { color:var(--mut); font-size:13px; }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; background:var(--lin); }
  .tag.ok { background:#1f9d5522; color:var(--ok); } .tag.err { background:#d6454522; color:var(--err); } .tag.warn { background:#c98a0022; color:var(--warn); }
  button.b, a.b { display:inline-block; font:inherit; border:1px solid var(--lin); background:var(--card); color:var(--tx); padding:7px 12px; border-radius:9px; cursor:pointer; }
  button.b.pri, a.b.pri { background:var(--pri); border-color:var(--pri); color:#fff; font-weight:600; }
  button.b:disabled { opacity:.5; cursor:default; }
  input, textarea, select { font:inherit; width:100%; padding:8px 10px; border:1px solid var(--lin); border-radius:9px; background:var(--bg); color:var(--tx); }
  textarea { min-height:110px; resize:vertical; }
  video { width:100%; max-height:460px; background:#000; border-radius:10px; }
  .av { width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--lin); }
  h2 { font-size:16px; margin:22px 0 10px; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  pre { white-space:pre-wrap; font-size:12px; max-height:340px; overflow:auto; background:var(--bg); padding:10px; border-radius:9px; }
  .vazio { padding:30px; text-align:center; color:var(--mut); }
  .sw { position:relative; width:42px; height:24px; flex:none; } .sw input { opacity:0; width:0; height:0; }
  .sw span { position:absolute; inset:0; background:var(--lin); border-radius:99px; cursor:pointer; transition:.2s; }
  .sw span:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .sw input:checked + span { background:var(--ok); } .sw input:checked + span:before { transform:translateX(18px); }
  #aviso { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--tx); color:var(--bg); padding:10px 16px; border-radius:10px; display:none; max-width:90vw; }
</style>
</head>
<body>
<aside class="lado">
  <div class="marca"><img src="/perfis/avatar-construiu.png" alt=""><div><b>Agência do Zé</b><small>6 perfis · 1 rede</small></div></div>
  <nav id="abas"></nav>
  <div class="rodape">
    <a class="item" href="/admin/escritorio"><svg viewBox="0 0 24 24"><path d="M4 21V7l8-4 8 4v14M9 21v-6h6v6"/></svg><span class="rot">Escritório</span></a>
    <div id="cfg"></div>
    <span id="status"></span>
    <button class="b pri" id="rodar">Produzir agora</button>
  </div>
</aside>
<div class="conteudo">
<header class="topo"><h1 id="titulo"></h1></header>
<main id="tela"></main>
</div>
<div id="aviso"></div>
<script>
const ABAS = {geral: 'Visão geral', fila: 'Fila de vídeos', agenda: 'Agenda', tendencias: 'Tendências', redes: 'Redes', comentarios: 'Comentários', perfis: 'Perfis', pautas: 'Pautas', links: 'Página de links', config: 'Configurações'};
const AVATAR = {cozinha: 'receitas', historia: 'historia', construiu: 'construiu', caso: 'crimes', rico: 'ricos', valeapena: 'valeapena'};
const STATUS = {produzindo: ['Produzindo', 'warn'], aguardando_aprovacao: ['Aguardando sua aprovação', 'warn'], aprovado: ['Aprovado', 'ok'],
  publicando: ['Publicando…', 'warn'], publicado: ['Publicado', 'ok'], erro: ['Erro', 'err'], rejeitado: ['Rejeitado', '']};
const ETAPA = {roteiro: 'agentes: pesquisa, roteiro, cenas e QA', narracao: 'narração', render: 'renderizando', legenda: 'legenda', pronto: 'pronto'};
let aba = location.hash.slice(1) || 'geral', E = null, ultimoLog = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const dt = (s) => s ? new Date(s).toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}) : '';
function aviso(t) { const a = $('#aviso'); a.textContent = t; a.style.display = 'block'; clearTimeout(a._t); a._t = setTimeout(() => a.style.display = 'none', 4000); }
async function api(c, corpo) {
  const r = await fetch('/api/' + c, corpo ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(corpo)} : {});
  const j = await r.json(); if (!r.ok) throw new Error(j.erro); return j;
}
const tentar = (f) => async (...a) => { try { await f(...a); } catch (e) { aviso('⚠️ ' + e.message); } await carregar(); };
const perfil = (id) => E.perfis.find((p) => p.id === id) ?? {nome: id};

const ICONE = {
  geral: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  fila: '<rect x="3" y="5" width="13" height="14" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',
  agenda: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
  tendencias: '<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  redes: '<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.3 10.9l7.4-3.8M8.3 13.1l7.4 3.8"/>',
  comentarios: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  perfis: '<circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0M16 4a3.5 3.5 0 0 1 0 7M22 21a7 7 0 0 0-4-6.3"/>',
  pautas: '<path d="M9 4h10M9 12h10M9 20h10M4 4h.01M4 12h.01M4 20h.01"/>',
  links: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  config: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
};
const itemAba = (k, v) => {
  const n = k === 'fila' ? E.fila.filter((x) => x.status === 'aguardando_aprovacao').length : k === 'comentarios' ? E.comentarios : 0;
  return `<button class="item${k === aba ? ' on' : ''}" onclick="ir('${k}')" title="${v}"><svg viewBox="0 0 24 24">${ICONE[k]}</svg><span class="rot">${v}</span>${n ? `<span class="num">${n}</span>` : ''}</button>`;
};
function abas() {
  $('#abas').innerHTML = Object.entries(ABAS).filter(([k]) => k !== 'config').map(([k, v]) => itemAba(k, v)).join('');
  $('#cfg').innerHTML = itemAba('config', ABAS.config);
  $('#titulo').textContent = ABAS[aba];
  $('#status').textContent = E.agencia_rodando ? '⚙️ agência trabalhando…' : '';
  $('#rodar').disabled = E.agencia_rodando;
}
function ir(k) { aba = k; ultimoLog = null; location.hash = k; render(); }

function telaFila() {
  if (!E.fila.length) return `<div class="card vazio">Nenhum vídeo ainda. Clique em <b>Produzir agora</b>, ou ligue a produção automática em Configurações.</div>`;
  const ordem = ['aguardando_aprovacao', 'produzindo', 'erro', 'aprovado', 'publicando', 'publicado', 'rejeitado'];
  const f = [...E.fila].sort((a, b) => ordem.indexOf(a.status) - ordem.indexOf(b.status));
  return `<div class="grade">${f.map((v) => {
    const [st, cor] = STATUS[v.status] ?? [v.status, ''];
    const p = perfil(v.perfil);
    const pode = ['aguardando_aprovacao', 'erro', 'aprovado'].includes(v.status) && v.video;
    return `<div class="card">
      <div class="linha"><img class="av" src="/perfis/avatar-${AVATAR[v.perfil]}.png"><div><b>${esc(v.tema)}</b><div class="mut">${esc(p.nome)} · ${dt(v.criado)}</div></div></div>
      <div class="linha" style="margin:10px 0"><span class="tag ${cor}">${st}</span>
        ${v.status === 'produzindo' ? `<span class="mut">${ETAPA[v.etapa] ?? v.etapa}</span>` : ''}
        ${v.voz ? `<span class="tag">🎙️ voz de teste</span>` : ''}
        ${v.agendado_para && v.status === 'aprovado' ? `<span class="mut">posta ${dt(v.agendado_para)}</span>` : ''}</div>
      ${v.video ? `<video src="/${v.video}" poster="/${v.capa ?? ''}" controls preload="none" playsinline></video>` : ''}
      ${v.erro ? `<p class="mut" style="color:var(--err)">${esc(v.erro)}</p>` : ''}
      ${v.publicacoes ? Object.entries(v.publicacoes).map(([r, x]) => `<div><a href="${esc(x.link)}" target="_blank">Ver no ${r}</a></div>`).join('') : ''}
      ${pode ? `<label>Legenda</label><textarea id="leg-${v.id}">${esc(v.legenda)}</textarea>
        <label>Conteúdo do direct (o que o robô manda para quem comentar; vazio = padrão do perfil)</label><textarea id="leg-ent-${v.id}" style="min-height:60px" onchange="salvarEntrega('${v.id}')" placeholder="Ex.: a receita completa com ingredientes e modo de preparo">${esc(v.entrega)}</textarea>
        <div class="linha" style="margin-top:10px">
          <button class="b pri" onclick="aprovar('${v.id}','agora')">Aprovar e postar agora</button>
          <button class="b" onclick="aprovar('${v.id}')">Aprovar p/ ${esc(p.horario)}</button>
          <button class="b" onclick="rejeitar('${v.id}')">Rejeitar</button>
        </div>` : ''}
      <div style="margin-top:8px"><a class="mut" href="#" onclick="verLog('video-${v.id}');return false">ver log da produção</a></div>
    </div>`;
  }).join('')}</div><div id="log"></div>`;
}
const aprovar = tentar(async (id, quando) => { await api(`fila/${id}/entrega`, {entrega: $('#leg-ent-' + id).value}); await api(`fila/${id}/aprovar`, {quando, legenda: $('#leg-' + id).value}); aviso(quando ? 'Postando…' : 'Agendado!'); });
const salvarEntrega = tentar(async (id) => { await api(`fila/${id}/entrega`, {entrega: $('#leg-ent-' + id).value}); aviso('Conteúdo do direct salvo'); });
const rejeitar = tentar(async (id) => { if (confirm('Rejeitar este vídeo?')) await api(`fila/${id}/rejeitar`, {}); });
async function verLog(n, rolar = true) { ultimoLog = n; const {texto} = await api('log/' + n); const el = $('#log'); if (!el) return; el.innerHTML = `<h2>Log: ${n}</h2><pre>${esc(texto || '(vazio)')}</pre>`; if (rolar) el.scrollIntoView(); }

function telaPerfis() {
  return `<div class="grade">${E.perfis.map((p) => `<div class="card">
    <div class="linha"><img class="av" src="/perfis/avatar-${AVATAR[p.id]}.png"><div style="flex:1"><b>${esc(p.nome)}</b><div class="mut">${esc(p.nicho)}</div></div>
      <label class="sw" title="Produção automática"><input type="checkbox" ${p.ativo ? 'checked' : ''} onchange="salvarPerfil('${p.id}',{ativo:this.checked})"><span></span></label></div>
    <div class="linha" style="margin-top:10px">
      <span class="tag ${p.conectado.instagram ? 'ok' : ''}">Instagram ${p.conectado.instagram ? 'conectado' : 'não conectado'}</span>
      <span class="tag ${p.conectado.facebook ? 'ok' : ''}">Facebook ${p.conectado.facebook ? 'conectado' : '—'}</span>
      <span class="tag">${p.pautas_novas} pautas na fila</span></div>
    ${!p.ativo && p.motivo_inativo ? `<p class="mut">${esc(p.motivo_inativo)}</p>` : ''}
    <label>Instagram (@)</label><input value="${esc(p.instagram)}" onchange="salvarPerfil('${p.id}',{instagram:this.value.replace('@','')})">
    <label>Horários de postagem (1 vídeo em cada, separados por vírgula)</label><input value="${esc((p.horarios || [p.horario]).join(', '))}" placeholder="12:00, 19:30" onchange="salvarPerfil('${p.id}',{horarios:this.value})">
    <label>Chamada (CTA) da legenda</label><input value="${esc(p.cta)}" onchange="salvarPerfil('${p.id}',{cta:this.value})">
    <label>Link da bio / funil</label><input value="${esc(p.link_bio)}" placeholder="https://" onchange="salvarPerfil('${p.id}',{link_bio:this.value})">
    <div class="linha" style="margin-top:12px"><button class="b" onclick="produzirPerfil('${p.id}')" ${E.agencia_rodando ? 'disabled' : ''}>Produzir 1 vídeo deste perfil</button></div>
  </div>`).join('')}</div>`;
}
const salvarPerfil = tentar(async (id, m) => { await api('perfis/' + id, m); aviso('Salvo'); });
const produzirPerfil = tentar(async (id) => { await api('agencia/rodar', {perfil: id}); aviso('Produção iniciada. Leva de 30 a 90 min.'); });

function telaPautas() {
  return `<p class="mut">A agência usa a primeira pauta "nova" de cada perfil ativo. Quando sobram menos de 3, o agente pauteiro cria mais sozinho.</p>
  <div class="grade">${E.perfis.map((p) => `<div class="card"><b>${esc(p.nome)}</b>
    ${p.pautas.map((x, i) => `<div class="linha" style="margin-top:6px"><span style="flex:1;${x.status !== 'nova' ? 'text-decoration:line-through;color:var(--mut)' : ''}">${esc(x.tema)}</span>
      ${x.status === 'nova' ? `<button class="b" style="padding:2px 8px" onclick="removerPauta('${p.id}',${i})">✕</button>` : ''}</div>`).join('')}
    <div class="linha" style="margin-top:10px"><input id="np-${p.id}" placeholder="Nova pauta…" onkeydown="if(event.key==='Enter')addPauta('${p.id}')"><button class="b" onclick="addPauta('${p.id}')">+</button></div>
  </div>`).join('')}</div>`;
}
const addPauta = tentar(async (id) => { const v = $('#np-' + id).value.trim(); if (v) await api('pautas/' + id, {tema: v}); });
const removerPauta = tentar(async (id, i) => { await api('pautas/' + id, {remover: i}); });

function telaConfig() {
  const c = E.config;
  const campo = (k, rot, dica = '', tipo = 'text') => `<label>${rot}</label><input id="cfg-${k}" type="${tipo}" value="${esc(c[k])}" placeholder="${esc(dica)}">`;
  return `<div class="grade">
  <div class="card"><b>Meta (app fnexus CRM)</b>
    <p class="mut">Cole o token de usuário de longa duração do app (permissões: instagram_basic, instagram_content_publish, pages_show_list, pages_read_engagement, pages_manage_posts; para o robô do direct também instagram_manage_comments, instagram_manage_messages, pages_manage_metadata, pages_messaging). Ele fica só no arquivo .env deste Mac.</p>
    ${campo('META_USER_TOKEN', 'Token de usuário', 'EAAG…', 'password')}
    ${campo('META_GRAPH_VERSION', 'Versão da Graph API', 'v22.0')}
    <div class="linha" style="margin-top:12px"><button class="b pri" onclick="salvarCfg()">Salvar</button><button class="b" onclick="descobrir()">Conectar contas automaticamente</button></div>
    <div id="contas"></div>
  </div>
  <div class="card"><b>Produção</b>
    ${campo('CLAUDE_CODE_OAUTH_TOKEN', 'Token do Claude Code (rode "claude setup-token" no Terminal e cole aqui)', 'sk-ant-oat…', 'password')}
    ${campo('ELEVENLABS_API_KEY', 'Chave do ElevenLabs', 'sk_…', 'password')}
    ${campo('AGENCIA_MAX_POR_PERFIL', 'Vídeos por perfil por noite', '1')}
    ${campo('NARRACAO_VELOCIDADE', 'Velocidade da narração', '1.3')}
    ${campo('AGENCIA_MODELO', 'Modelo do Claude (vazio = padrão)', '')}
    ${campo('ELEVENLABS_VOZ', 'Voz do ElevenLabs (id)', '5Ny27k6jpd2wJTdmbFsb = Fernando')}
    <label>Agentes do escritório (pautas, tendências, comentários, horários)</label><select id="cfg-AGENTES_LIGADOS"><option value="0">Desligados</option><option value="1" ${c.AGENTES_LIGADOS === '1' ? 'selected' : ''}>Ligados (cada um no seu horário)</option></select>
    <label>Produção automática (todo dia às 02:00)</label><select id="cfg-PRODUCAO_AUTOMATICA"><option value="0">Desligada (só quando eu mandar)</option><option value="1" ${c.PRODUCAO_AUTOMATICA === '1' ? 'selected' : ''}>Ligada</option></select>
    <label>Publicação</label><select id="cfg-AUTO_PUBLICAR"><option value="0" ${c.AUTO_PUBLICAR !== '1' ? 'selected' : ''}>Esperar minha aprovação</option><option value="1" ${c.AUTO_PUBLICAR === '1' ? 'selected' : ''}>Publicar sozinho no horário do perfil</option></select>
    <label>Postar também como Reels na Página do Facebook</label><select id="cfg-META_POSTAR_FACEBOOK"><option value="0">Não</option><option value="1" ${c.META_POSTAR_FACEBOOK === '1' ? 'selected' : ''}>Sim</option></select>
    <div class="linha" style="margin-top:12px"><button class="b pri" onclick="salvarCfg()">Salvar</button></div>
  </div>
  <div class="card"><b>Outros canais e monetização</b>
    ${campo('YOUTUBE_API_KEY', 'Chave da API do YouTube (estatísticas e tendências)', 'AIza…', 'password')}
    ${campo('YOUTUBE_CLIENT_ID', 'YouTube: ID do cliente OAuth (para postar)', '….apps.googleusercontent.com')}
    ${campo('YOUTUBE_CLIENT_SECRET', 'YouTube: chave secreta do cliente OAuth', 'GOCSPX-…', 'password')}

// ---------- Visão geral: números de todos os canais e o funil até a monetização ----------
const n = (v) => v == null ? '—' : Number(v).toLocaleString('pt-BR');
function totais() {
  const A = E.analytics || {perfis: {}};
  let seg = 0, views = 0, alcance = 0, inter = 0, perfilViews = 0, cliques = 0, yt = 0;
  for (const r of Object.values(A.perfis || {})) {
    const i = r.instagram; if (i) { seg += i.followers_count || 0; views += i.views_30d || 0; alcance += i.alcance_30d || 0; inter += i.interacoes_30d || 0;
      perfilViews += i.conta_insights?.profile_views || 0; cliques += i.conta_insights?.website_clicks || 0; }
    if (r.youtube?.inscritos) yt += r.youtube.inscritos;
    if (r.youtube?.views) views += r.youtube.views;
  }
  return {seg, views, alcance, inter, perfilViews, cliques, yt, grupo: A.telegram};
}
function sparkSeg(perfilId) {
  const h = (E.analytics?.historico || []).filter((x) => x.perfil === perfilId && x.rede === 'instagram').slice(-30);
  if (h.length < 2) return '';
  const vs = h.map((x) => x.seguidores), mn = Math.min(...vs), mx = Math.max(...vs) || 1;
  const pts = vs.map((v, i) => `${(i / (vs.length - 1)) * 100},${28 - ((v - mn) / ((mx - mn) || 1)) * 26}`).join(' ');
  return `<svg viewBox="0 0 100 30" style="width:100%;height:30px"><polyline fill="none" stroke="var(--pri)" stroke-width="2" points="${pts}"/></svg>`;
}
function telaGeral() {
  const t = totais(), A = E.analytics || {};

  const receita = Number(E.config.RECEITA_AFILIADO_MES || 0);
  const kpi = (v, r, d = '') => `<div class="card"><div class="mut">${r}</div><div style="font-size:26px;font-weight:700">${v}</div><div class="mut">${d}</div></div>`;
  const etapas = [['Visualizações (30 dias)', t.views || t.alcance], ['Visitas aos perfis', t.perfilViews], ['Cliques no link da bio', t.cliques], ['Membros do grupo de ofertas', t.grupo], ['Receita de afiliado no mês (R$)', receita || null]];
  const max = Math.max(...etapas.map((e) => e[1] || 0), 1);
  return `
  ${!A.atualizado ? `<div class="card" style="margin-bottom:14px">📡 Ainda sem dados das redes. Conecte a Meta em <a href="#config" onclick="ir('config')">Configurações</a> e clique em <b>Atualizar números</b>.</div>` : ''}
  <div class="linha" style="justify-content:space-between;margin-bottom:10px"><span class="mut">${A.atualizado ? `Números de ${dt(A.atualizado)}` : ''}${(A.erros || []).length ? ` · ⚠️ ${A.erros.length} aviso(s)` : ''}</span>
    <button class="b" onclick="atualizar()">🔄 Atualizar números</button></div>
  <div class="grade" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">
    ${kpi(n(t.seg), 'Seguidores no Instagram', '6 perfis')}${kpi(n(t.yt), 'Inscritos no YouTube')}${kpi(n(t.views || t.alcance), 'Views (Instagram + YouTube)')}
    ${kpi(n(t.inter), 'Interações em 30 dias')}${kpi(n(t.grupo), 'Membros do grupo')}${kpi(receita ? 'R$ ' + n(receita) : '—', 'Afiliado no mês')}
  </div>
  <h2>Produção</h2>
  <div class="grade" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">
    ${kpi(prod, 'Produzindo agora')}${kpi(esp, 'Esperando sua aprovação')}${kpi(ag, 'Agendados')}${kpi(pub, 'Publicados')}
  </div>
  <h2>Funil até a monetização</h2>
  <div class="card">${etapas.map(([r, v]) => `<div style="margin:8px 0"><div class="linha" style="justify-content:space-between"><span>${r}</span><b>${n(v)}</b></div>
    <div style="height:10px;background:var(--lin);border-radius:9px"><div style="height:10px;border-radius:9px;background:var(--pri);width:${Math.max(2, ((v || 0) / max) * 100)}%"></div></div></div>`).join('')}
    <p class="mut">Cliques no link vêm do Instagram (website_clicks). Membros do grupo vêm do bot do Telegram. A receita de afiliado você digita em Configurações até ligarmos a API da loja.</p></div>
  <h2>Por perfil</h2>

      <div class="linha" style="margin-top:10px;justify-content:space-between"><span>Seguidores <b>${n(i?.followers_count)}</b></span><span>Views 30d <b>${n(i?.views_30d || i?.alcance_30d)}</b></span><span>Posts <b>${n(i?.media_count)}</b></span></div>

function telaAgenda() {
  const itens = E.fila.filter((x) => ['aprovado', 'publicado', 'publicando', 'aguardando_aprovacao'].includes(x.status))
    .map((x) => ({...x, quando: x.status === 'publicado' ? x.publicado_em : x.agendado_para}))
    .sort((a, b) => new Date(b.quando || 0) - new Date(a.quando || 0));
  const dias = [];

}
